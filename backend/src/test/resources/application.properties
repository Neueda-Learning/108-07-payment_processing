# Test configuration: in-memory H2 instead of the real MySQL instance, so the
# test suite runs standalone (no external database needed). This file lives on
# the test classpath ahead of src/main/resources/application.properties, so it
# overrides it for every test in this module.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-256-bit-secret-key-not-for-production-use-32chars
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:3000
