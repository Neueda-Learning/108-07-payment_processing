server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API requests to the backend container over the internal
    # docker network, so the browser only ever talks to this one port.
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets directly, fall back to index.html for React Router
    # client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
